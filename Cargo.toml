[package]
name = "holy-cors"
version = "0.4.2"
edition = "2021"
authors = ["Bug Days"]
description = "Holy CORS! The local API bridge for Bug Days"
repository = "https://github.com/bugdays-com/holy-cors"
license = "MIT"
keywords = ["cors", "proxy", "grpc", "kafka", "tls"]
categories = ["development-tools", "web-programming"]

[dependencies]
# Core async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }

# HTTP server + client (low-level, well-maintained)
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"

# TLS for HTTPS targets
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
rustls-native-certs = "0.8"

# Local DNS diagnostics
hickory-resolver = "0.26"

# Structured local bridge APIs
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# OpenSSL enables TLS and SCRAM; librdkafka handles PLAIN itself. The `sasl`
# feature additionally links GSSAPI/Kerberos, which is outside this client.
rdkafka = { version = "0.39", features = ["ssl-vendored", "cmake-build"] }
rand = "0.9"

# CLI parsing
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL parsing
url = "2"

# HTTP types
http = "1"
bytes = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
